name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: "QA (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest

      - name: Coding standards
        run: composer ci:php:cs

      - name: Static analysis
        run: composer ci:php:stan

  tests:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
        dependencies:
          - lowest
          - highest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run tests
        run: composer ci:tests:unit

  # The one status the branch rulesets require. Matrix job names change with
  # the matrix, a required check listing each of them would have to follow.
  all-checks:
    name: "all checks"
    if: always()
    needs:
      - qa
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          QA_RESULT: ${{ needs.qa.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "qa: ${QA_RESULT}, tests: ${TESTS_RESULT}"
          [ "${QA_RESULT}" = "success" ] && [ "${TESTS_RESULT}" = "success" ]
